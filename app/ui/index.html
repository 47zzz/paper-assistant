<!doctype html>
<html lang="en" data-accent="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1011" media="(prefers-color-scheme: dark)">
<title>Paper Assistant</title>
<link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<script>
(function(){try{
  var qs=new URLSearchParams(location.search),q=qs.get('theme'),t=q||localStorage.getItem('theme')||'auto';
  if(q){window.__forceTheme=q}
  if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t}
  var a=localStorage.getItem('accent');if(a){document.documentElement.dataset.accent=a}
  var d=localStorage.getItem('density');if(d==='compact'){document.documentElement.dataset.density='compact'}
  if(localStorage.getItem('motion')==='reduce'){document.documentElement.dataset.motion='reduce'}
}catch(e){}})();
</script>
<link rel="stylesheet" href="/app/ui/app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" aria-label="Main menu">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      <b>Paper Assistant</b>
      <button class="icon-btn sm collapse" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <button class="searchbtn" id="searchBtn" aria-label="Search or run a command"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search, commands…</span><kbd>⌘K</kbd></button>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="sidesec">Topics</div>
    <div class="topics" id="topics"></div>
    <div class="sidefoot">
      <button class="timermini" id="timerMini" aria-label="Focus timer"></button>
      <div class="mascotrow">
        <div class="mascot idle" id="mascot" role="button" tabindex="0" aria-label="Yan" title="Yan">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <g class="cap"><path d="M14 26 C 18 10, 44 6, 50 20 L 52 24 Z" fill="#5e6ad2"/><circle cx="52" cy="24" r="3.5" fill="#fff"/></g>
            <ellipse cx="32" cy="40" rx="20" ry="18" fill="#8b7355"/>
            <ellipse cx="32" cy="44" rx="12" ry="11" fill="#c9b08f"/>
            <path d="M14 28 Q 20 18 26 26" fill="none" stroke="#8b7355" stroke-width="3" stroke-linecap="round"/>
            <path d="M50 28 Q 44 18 38 26" fill="none" stroke="#8b7355" stroke-width="3" stroke-linecap="round"/>
            <circle cx="23" cy="32" r="8" fill="#fff"/><circle cx="41" cy="32" r="8" fill="#fff"/>
            <g class="eyes"><circle class="pupil" cx="23" cy="32" r="3.4" fill="#111"/><circle class="pupil" cx="41" cy="32" r="3.4" fill="#111"/></g>
            <rect class="lid" x="14" y="23" width="18" height="18" rx="9" fill="#8b7355"/>
            <rect class="lid" x="32" y="23" width="18" height="18" rx="9" fill="#8b7355"/>
            <path d="M29 40 L32 45 L35 40 Z" fill="#e0912f"/>
            <path d="M22 58 l3 -5 M26 58 l1 -5 M38 58 l-1 -5 M42 58 l-3 -5" stroke="#e0912f" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="bubble" id="bubble" aria-live="polite"></div>
        </div>
        <div class="streak" id="sideStreak"></div>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="offline" id="offline" role="status"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="9"/></svg><span>Server offline… reconnecting</span></div>
    <header class="pagehead" id="pagehead"></header>
    <div class="content" id="content"><div class="inner" id="page"></div></div>
  </main>

  <aside class="drawer" id="drawer" aria-label="Paper details"></aside>

  <nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="palette" aria-label="Command palette"></dialog>

<script src="/app/ui/vendor/canvas-confetti.min.js" defer></script>
<script src="/app/ui/app.js" defer></script>
</body>
</html>
